<script id="npg-fullscreen-snippet">

        `;
        const s = document.createElement('style'); s.id = 'npg-fullscreen-styles'; s.appendChild(document.createTextNode(css)); document.head.appendChild(s);
    }
    ensureStyles();
    document.addEventListener('fullscreenchange', ()=>{
        if(document.fullscreenElement) document.documentElement.classList.add('npg-fullscreen-active');
        else document.documentElement.classList.remove('npg-fullscreen-active');
    });
    const hasToolbar = !!document.querySelector('.game-toolbar button') || !!document.querySelector('[onclick*="toggleGameFullscreen"]');

        const iframe = document.querySelector('iframe') || document.querySelector('.game-frame') || document.documentElement;

            try{ req.call(target); }catch(e){ window.open(location.href, '_blank'); }
        } else {
            window.open(location.href, '_blank');
        }
    });
    document.body.appendChild(btn);
})();
