name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate XML sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://nikunjprogames.github.io/
          exclude-paths: >
            /template.html
            /category-template.html
            /account.html
            /liked-games.html
            /play.html
            /offline.html
            /submission-success.html
            /favicon-code.html
            /NikunjProGame.html
            /article.html
            /crowd-rush.html

      - name: Remove verification utility URL
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from urllib.parse import unquote, urlsplit

          path = "sitemap.xml"
          tree = ET.parse(path)
          root = tree.getroot()
          namespace = "{http://www.sitemaps.org/schemas/sitemap/0.9}"
          ET.register_namespace("", namespace[1:-1])
          verification_path = "/google57b19170d71224df .html"
          for entry in list(root.findall(f"{namespace}url")):
              location = entry.find(f"{namespace}loc")
              if location is not None and unquote(urlsplit(location.text or "").path) == verification_path:
                  root.remove(entry)
          ET.indent(tree, space="  ")
          tree.write(path, encoding="UTF-8", xml_declaration=True)
          PY

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
