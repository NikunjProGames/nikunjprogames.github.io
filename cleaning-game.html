<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cleaning Game | Nikunj Pro Games</title>
  <meta name="description" content="Play the Cleaning Game in a polished iframe experience on Nikunj Pro Games." />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #050816;
      --panel: rgba(8, 11, 24, 0.9);
      --border: rgba(255, 255, 255, 0.14);
      --cyan: #00d4ff;
      --purple: #8b00ff;
      --text: #f5f7ff;
      --muted: #9aa3bd;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(0, 212, 255, 0.16), transparent 28%),
        radial-gradient(circle at bottom right, rgba(139, 0, 255, 0.18), transparent 32%),
        var(--bg);
    }

    .game-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: rgba(4, 7, 18, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28);
      z-index: 10;
    }

    .brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }

    .btn.primary {
      background: linear-gradient(90deg, var(--purple), #5c1aff);
      border-color: transparent;
    }

    .game-frame-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .game-frame-card {
      width: min(100%, 1280px);
      height: min(78vh, 840px);
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.5);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .info-card {
      position: fixed;
      left: 16px;
      bottom: 16px;
      max-width: 360px;
      padding: 14px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 16px 40px rgba(0,0,0,0.3);
      z-index: 20;
    }

    .info-card.hidden { display: none; }

    .info-card h2 {
      margin: 0 0 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      color: var(--cyan);
    }

    .info-card p, .info-card li {
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.95rem;
      margin: 0 0 8px;
    }

    code {
      display: block;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 0.82rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 8px;
    }

    .toggle-btn {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 21;
      border: 0;
      padding: 10px 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      color: white;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(0,0,0,0.22);
    }

    .copy-btn {
      margin-top: 10px;
      padding: 8px 10px;
      border: 0;
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
    }

    @media (max-width: 700px) {
      .game-header { padding: 12px 14px; }
      .brand { font-size: 0.95rem; }
      .btn { font-size: 0.8rem; padding: 7px 10px; }
      .game-frame-wrap { padding: 14px; }
      .game-frame-card { height: 72vh; border-radius: 16px; }
      .info-card { max-width: calc(100% - 32px); left: 16px; right: 16px; bottom: 70px; }
      .toggle-btn { right: 14px; bottom: 14px; }
    }
  </style>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3172987137389272" crossorigin="anonymous"></script>
  <style>
    .page-ad-section { max-width: 980px; margin: 24px auto 0; padding: 14px 16px; border: 1px solid rgba(139, 0, 255, 0.2); background: rgba(255, 255, 255, 0.03); border-radius: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); }
    .page-ad-section .ad-label { font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: #8B00FF; margin-bottom: 8px; text-align: center; font-weight: 700; }
    .page-ad-section .adsbygoogle { min-height: 90px; }
  </style>
  <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <div class="brand">Cleaning Game</div>
      <div class="header-actions">
     
        <a class="btn primary" href="https://nikunjprogames.github.io/#games" target="_blank" rel="noopener"><i class="fa-solid fa-gamepad"></i> Explore Games</a>
      </div>
    </header>

    <main class="game-frame-wrap">
      <div class="game-frame-card">
        <iframe src="https://html5.gamemonetize.games/d4ghi83mqnae1strdmx5p1m1sp3vq4ij/" title="Cleaning Game iframe" loading="lazy" allowfullscreen></iframe>
      </div>
    </main>
  </div>



  <script>
    function toggleInfo() {
      const card = document.getElementById('infoCard');
      card.classList.toggle('hidden');
    }

    async function copyEmbedCode() {
      const code = document.getElementById('embedCode').textContent;
      try {
        await navigator.clipboard.writeText(code);
        const btn = event.currentTarget;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied';
        setTimeout(() => {
          btn.innerHTML = '<i class="fa-solid fa-copy"></i> Copy Code';
        }, 1500);
      } catch (err) {
        console.error('Copy failed', err);
      }
    }
  </script>

  <section class="page-ad-section" aria-label="Sponsored content">
    <div class="ad-label">Sponsored</div>
    <ins class="adsbygoogle"
         style="display:block; text-align:center;"
         data-ad-client="ca-pub-3172987137389272"
         data-ad-slot="1234567890"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </section>
</body>
</html>
