<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{CATEGORY}} Games Online | PleyZ</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://nikunjprogames.github.io/{{CATEGORY_SLUG}}-games/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{CATEGORY}} Games Online | PleyZ">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="https://nikunjprogames.github.io/{{CATEGORY_SLUG}}-games/">
  <meta property="og:site_name" content="PleyZ">
  <meta property="og:image" content="https://nikunjprogames.github.io/icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{CATEGORY}} Games Online | PleyZ">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="https://nikunjprogames.github.io/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <script type="application/ld+json">{{JSON_LD}}</script>
  <style>
    :root { color-scheme: dark; --bg: #0a0a0f; --panel: #11131c; --text: #eeeefe; --muted: #b1b5c8; --accent: #00bfff; --border: rgba(139,0,255,.35); }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px 'Rajdhani', sans-serif; }
    a { color: inherit; }
    .skip-link { position: absolute; left: 12px; top: -60px; z-index: 5; padding: 10px 14px; background: #fff; color: #111; }
    .skip-link:focus { top: 12px; }
    .page { width: min(1200px, 100% - 32px); margin: 0 auto; padding: 22px 0 48px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .brand { font: 700 1.3rem 'Orbitron', sans-serif; text-decoration: none; }
    nav { display: flex; flex-wrap: wrap; gap: 16px; }
    .breadcrumbs { margin: 20px 0 10px; color: var(--muted); }
    .breadcrumbs a, .category-links a { color: #8cddff; }
    h1, h2 { font-family: 'Orbitron', sans-serif; }
    h1 { margin: 16px 0 8px; font-size: clamp(1.7rem, 5vw, 2.8rem); }
    .intro { max-width: 720px; color: var(--muted); line-height: 1.5; }
    .catalog-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 32px 0 14px; }
    .catalog-heading h2 { margin: 0; font-size: 1.15rem; }
    .catalog-heading p { margin: 0; color: var(--muted); }
    .game-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 14px; }
    .game-item { min-width: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); text-decoration: none; }
    .game-item img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #05070d; }
    .game-item span { display: block; padding: 10px 12px; font-weight: 700; }
    .game-item:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .category-links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
    .site-footer { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--border); color: var(--muted); }
    .site-footer a { text-decoration: none; }
    body.theme-brain { --accent: #68dfff; --border: rgba(104,223,255,.34); background: radial-gradient(ellipse at 85% 4%, rgba(0,111,170,.2), transparent 38%), var(--bg); }
    body.theme-skill { --accent: #a7f36b; --border: rgba(167,243,107,.3); }
    body.theme-tactical { --accent: #ff765f; --border: rgba(255,118,95,.32); background: radial-gradient(ellipse at 85% 4%, rgba(143,37,33,.18), transparent 38%), var(--bg); }
    body.theme-intense { --accent: #ff9b4a; --border: rgba(255,119,57,.34); }
    body.theme-weird { --accent: #65e8d0; --border: rgba(101,232,208,.32); background: radial-gradient(ellipse at 85% 4%, rgba(9,124,111,.2), transparent 38%), var(--bg); }
    body.theme-chill { --accent: #80e5bf; --border: rgba(128,229,191,.3); }
    body.theme-arcade { --accent: #ffd369; --border: rgba(255,211,105,.32); }
    body.theme-retro { --accent: #ffca7a; --border: rgba(255,172,91,.34); background: radial-gradient(ellipse at 85% 4%, rgba(125,67,22,.2), transparent 38%), var(--bg); }
    body.theme-spooky { --accent: #c39bff; --border: rgba(132,93,192,.38); background: radial-gradient(ellipse at 85% 4%, rgba(38,79,66,.22), transparent 38%), var(--bg); }
    body.theme-hidden { --accent: #d2a3ff; --border: rgba(178,106,255,.38); background: radial-gradient(ellipse at 85% 4%, rgba(81,37,121,.24), transparent 38%), var(--bg); }
    @media (max-width: 520px) { .page { width: min(100% - 24px, 1200px); } header { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body class="theme-{{CATEGORY_THEME}}">
  <a class="skip-link" href="#main-content">Skip to games</a>
  <div class="page">
    <header>
      <a class="brand" href="/">PleyZ</a>
      <nav aria-label="Primary"><a href="/">Home</a><a href="/#games">All games</a><a href="/account.html">Account</a></nav>
    </header>
    <main id="main-content">
      <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="/">Home</a> / {{CATEGORY}} Games</nav>
      <h1>{{CATEGORY}} Games</h1>
      <p class="intro">{{DESCRIPTION}}</p>
      <div class="catalog-heading"><h2>{{CATEGORY}} browser games</h2><p>{{GAME_COUNT}} games</p></div>
      <div class="game-list">{{GAME_CARDS}}</div>
      <section aria-labelledby="related-categories-heading">
        <h2 id="related-categories-heading">Explore more categories</h2>
        <nav class="category-links" aria-label="Related categories">{{RELATED_CATEGORIES}}</nav>
      </section>
    </main>
    <footer class="site-footer">
      <a href="/">PleyZ Home</a>
      <a href="/account.html">Account</a>
      <a href="/about-us.html">About</a>
      <a href="/privacy-policy.html">Privacy</a>
      <a href="/termsandconditions.html">Terms</a>
      <a href="/contact-us.html">Contact</a>
    </footer>
  </div>
</body>
</html>
